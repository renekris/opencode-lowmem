name: lowmem-npm
on:
  push:
    tags: ["v*-lowmem.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.18.21-lowmem.6)"
        required: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || format('refs/tags/{0}', github.ref_name)) || github.ref }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ env.REF }} }
      - uses: oven-sh/setup-bun@v2
      - name: Build platform binaries
        run: cd packages/opencode && OPENCODE_VERSION="${GITHUB_REF_NAME#v}" OPENCODE_CHANNEL=latest bun run build
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
      - name: Assemble and publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          ./scripts/fork-publish-npm.sh --publish
